<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yasirweb</title>

    <link rel="stylesheet" href="loginpage.css">
    <link rel="stylesheet" href="forwebload.css">

</head>

<body>

    <!-- LOADER -->
    <div id="loader">

        <div class="loader-content">

            <div class="loader-ring"></div>

            <div class="loader-logo">Y</div>

            <p>Yasirweb</p>

            <span>Loading...</span>

        </div>

    </div>


    <!-- SIGN UP FORM -->
    <div id="fora">

        <form action="master.html" id="form">

            <h1>Join Us On Yasirweb.com</h1>

            <label>Username</label>
            <input type="text" class="all" required>


            <label>Email</label>
            <input type="email" class="all" required>


            <label>Password</label>
            <input type="password" class="all" required>


            <label>Confirm Password</label>
            <input type="password" class="all" required>


            <button id="btn" type="submit">
                Begin Your Journey
            </button>

        </form>

    </div>


    <!-- JAVASCRIPT -->
    <script src="forwebload.js"></script>

</body>

</html>
